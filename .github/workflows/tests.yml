name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install core dependencies (no GPU / ML extras needed for the tests)
        run: pip install -r requirements-dev.txt
      - name: Unit, integration and end-to-end tests
        run: pytest -q
      - name: Synthetic stress benchmark (judging logic)
        run: python scripts/eval_synthetic.py --n 100
