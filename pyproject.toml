[project]
name = "shottracker"
version = "0.1.0"
description = "Basketball shot tracker: detects shots in video, judges make/miss and estimates release mechanics."
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
